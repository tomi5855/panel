<html lang="es">
<head>

<title>Panel</title>
<link rel="manifest" href="manifest.webmanifest">

<style>
:root{--ink:#13263A;--muted:#4A5B6E;--soft:#34475B;--blue:#2A86C4;--blue-soft:rgba(42,134,196,.45);--accent:#0F6AAD;--warn-bg:rgba(225,154,18,.18);--warn:#7A4F00;--glass:rgba(255,255,255,.4);--line:rgba(19,38,58,.1)}
*{box-sizing:border-box}
html,body{margin:0;background:#E9E4DC}
body{font-family:-apple-system,"SF Pro Text","Inter",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;min-height:100vh}
button{font:inherit;color:inherit}
a{color:var(--accent)}a:hover{color:#0B4F82}
.bg{position:fixed;inset:0;overflow:hidden;background:#DCE6EE;z-index:0}
.bg .fill{position:absolute;left:-60px;top:-60px;width:calc(100% + 120px);height:calc(100% + 120px);object-fit:cover;filter:blur(40px) brightness(1.06) saturate(1.05);opacity:0;transition:opacity .6s}
.bg .foto{position:absolute;left:-8px;top:-8px;width:calc(100% + 16px);height:calc(100% + 16px);object-fit:cover;filter:blur(1.5px) brightness(1.06);opacity:0;transition:opacity .6s}
.bg img.on{opacity:1}
.bg .velo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(250,251,252,.1))}
.wrap{position:relative;z-index:1;max-width:1360px;margin:0 auto;padding:28px;padding-top:max(28px,env(safe-area-inset-top));display:flex;flex-wrap:wrap;gap:20px}
.glass{background:var(--glass);backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);border:1px solid rgba(255,255,255,.7);box-shadow:0 14px 40px rgba(30,40,55,.12),inset 0 1px 0 rgba(255,255,255,.9);border-radius:24px}
aside{flex:1 1 210px;padding:18px;display:flex;flex-direction:column;gap:18px;align-self:flex-start}
main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px}
.who{display:flex;align-items:center;gap:10px}
.av{width:40px;height:40px;border-radius:20px;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent)}
nav{display:flex;flex-wrap:wrap;gap:6px}
.nav{flex:1 1 150px;display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border-radius:14px;text-decoration:none;color:#2C3E52;font-size:15px;font-weight:600}
.nav:hover{background:rgba(255,255,255,.45);color:var(--ink)}
.nav.on{background:rgba(255,255,255,.75);color:var(--accent)}
.sync{font-size:12px;color:var(--muted);line-height:1.4}
.lbl{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s12{grid-column:span 12}
.card{padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rowb{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{margin:2px 0 0;font-size:40px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
.sub{font-size:15px;font-weight:500;color:#3E5064}
.big{font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1}
.m{font-size:13px;color:var(--muted)}
.t15{font-size:15px;font-weight:600;line-height:1.3}
.pill{font-size:11px;font-weight:600;padding:3px 8px;border-radius:10px;background:rgba(255,255,255,.6);color:#2C5A80;white-space:nowrap}
.warn{font-size:11px;font-weight:600;padding:3px 8px;border-radius:10px;background:var(--warn-bg);color:var(--warn);white-space:nowrap}
.grey{font-size:11px;font-weight:600;padding:3px 8px;border-radius:10px;background:var(--line);color:var(--soft);white-space:nowrap}
.tile{padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.45)}
.hr{height:1px;background:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:10px 16px;border-radius:18px;display:flex;align-items:baseline;gap:8px}
.btn{font-size:14px;font-weight:600;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.55);cursor:pointer}
.btn:hover{background:rgba(255,255,255,.85)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dark:hover{background:#22384F}
.btn.sel{background:#fff;border:2px solid var(--blue);color:#0F5A8F}
.btn:disabled{opacity:.35;cursor:default}
.chk{width:28px;height:28px;flex:none;border-radius:14px;border:1.6px solid rgba(19,38,58,.35);background:rgba(255,255,255,.55);padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.chk.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.item{display:flex;gap:12px;align-items:flex-start;padding:7px 0}
.bar{height:8px;border-radius:4px;background:var(--line)}
.bar>div{height:8px;border-radius:4px;background:var(--blue)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:34px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.hb{text-align:left;cursor:pointer;min-height:88px;padding:14px 16px;border-radius:20px;border:2px solid rgba(255,255,255,.75);background:rgba(255,255,255,.5);display:flex;align-items:center;gap:14px}
.hb:hover{background:rgba(255,255,255,.8)}
.hb.sel{background:#fff;border-color:var(--blue)}
.ico{width:44px;height:44px;flex:none;border-radius:22px;display:flex;align-items:center;justify-content:center;background:rgba(42,134,196,.12);color:#1F6FA6}
.hb.sel .ico{background:var(--blue);color:#fff}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;margin-left:-14px;border-radius:22px;text-decoration:none;font-size:14px;font-weight:600;color:var(--ink)}
.back:hover{background:rgba(255,255,255,.45)}
.empty{padding:14px;border-radius:18px;background:rgba(255,255,255,.45);font-size:14px;color:var(--soft);line-height:1.45}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.field input,.field select{font:inherit;font-weight:500;height:46px;padding:0 14px;border-radius:14px;border:1px solid rgba(19,38,58,.2);background:rgba(255,255,255,.8);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9;background:var(--ink);color:#fff;padding:12px 18px;border-radius:16px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:90vw}
.toast[hidden]{display:none}
.pild-t{font-size:20px;font-weight:650;line-height:1.3;letter-spacing:-.01em}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
@media (max-width:1100px){.s3,.s4,.s5,.s7{grid-column:span 6}.s6{grid-column:span 12}}
@media (max-width:700px){.s3,.s4,.s5,.s6,.s7{grid-column:span 12}.wrap{padding:14px;padding-top:max(14px,env(safe-area-inset-top))}h1{font-size:34px}aside{padding:14px}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><img id="bgfill" class="fill" alt=""><img id="bgimg" class="foto" alt=""><div class="velo"></div></div>
<div class="wrap">
  <aside class="glass">
    <div class="who">
      <div class="av" aria-hidden="true">T</div>
      <div><div style="font-weight:700;font-size:15px">Tomás</div><div class="m" style="font-size:12px">Panel de vida</div></div>
    </div>
    <nav id="nav" aria-label="Secciones"></nav>
    <div class="sync" id="sync"></div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
'use strict';
var VERSION = '1.1.0';
var K = { llave: 'panel-llave', repo: 'panel-repo', api: 'panel-api', cache: 'panel-cache-v1', foto: 'panel-foto', bgf: 'panel-bg-file', bgd: 'panel-bg-data' };
var TRAMOS = [{ id: 'menos-5', t: 'Menos de 5 min', min: 3 }, { id: '5-10', t: '5-10 min', min: 8 }, { id: '10-30', t: '10-30 min', min: 20 }, { id: 'mas-30', t: 'Más de 30 min', min: 40 }];
var ICO = {
  hoy: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  finanzas: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg>',
  trabajo: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>',
  yo: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  ajustes: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  check: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>',
  lectura: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v14c-3-1-6-1-8 1-2-2-5-2-8-1z"/><path d="M12 6v14"/></svg>',
  deporte: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="14" cy="4.5" r="2"/><path d="M7 21l3-6 3 2v4"/><path d="M6 12l3-4 4 1 3 3 3 1"/><path d="M10 15l-1-4"/></svg>',
  escritura: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>',
  'accion-buena': '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>',
  clock: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7A4F00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  back: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>'
};

/* ---------- utilidades ---------- */
function $(id) { return document.getElementById(id); }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function hoyIso() { return iso(new Date()); }
function parseIso(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function addDias(s, n) { var d = parseIso(s); d.setDate(d.getDate() + n); return iso(d); }
function difDias(a, b) { return Math.round((parseIso(b) - parseIso(a)) / 86400000); }
function lunes(s) { var d = parseIso(s), w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return iso(d); }
var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
var MESC = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
var DIAS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
var LETRAS = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];
function fechaLarga(s) { var d = parseIso(s); return DIAS[d.getDay()] + ', ' + d.getDate() + ' de ' + MESES[d.getMonth()]; }
function corta(s) { var d = parseIso(s); return d.getDate() + ' ' + MESC[d.getMonth()]; }
function eur(v, dec) { if (v == null || isNaN(v)) return '—'; var neg = v < 0, a = Math.abs(v), d = dec === 0 ? 0 : 2; var s = a.toFixed(d).split('.'); s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.'); return (neg ? '−' : '') + s.join(',') + ' €'; }
function pctTxt(v, signo) { if (v == null) return '—'; var s = String(Math.abs(v)).replace('.', ','); return (signo ? (v > 0 ? '+' : v < 0 ? '−' : '') : (v < 0 ? '−' : '')) + s + ' %'; }
function b64dec(s) { var bin = atob(String(s).replace(/\s/g, '')); var bytes = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
function b64enc(str) { var bytes = new TextEncoder().encode(str), bin = ''; for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]); return btoa(bin); }
var tt = null;
function toast(msg) { var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(function () { t.hidden = true; }, 3200); }

/* ---------- estado ---------- */
var D = { panel: null, cfg: null, reg: { v: 1, dias: {} }, reac: { v: 1, items: {} }, hechas: { v: 1, items: {} }, sha: {}, sync: null, pend: {} };
var UI = { sel: {}, tramo: null, acc: {}, verTodo: false };
(function cargarCache() { try { var c = JSON.parse(lsGet(K.cache) || 'null'); if (c) { D.panel = c.panel; D.cfg = c.cfg; D.reg = c.reg || D.reg; D.reac = c.reac || D.reac; D.hechas = c.hechas || D.hechas; D.sha = c.sha || {}; D.sync = c.sync || null; D.pend = c.pend || {}; } } catch (e) {} })();
function guardar() { lsSet(K.cache, JSON.stringify({ panel: D.panel, cfg: D.cfg, reg: D.reg, reac: D.reac, hechas: D.hechas, sha: D.sha, sync: D.sync, pend: D.pend })); }

/* ---------- GitHub ---------- */
function llave() { return lsGet(K.llave) || ''; }
function repo() { return lsGet(K.repo) || 'tomi5855/panel-datos'; }
function api() { return lsGet(K.api) || 'https://api.github.com'; }
function gh(path, opts) {
  opts = opts || {};
  var h = { 'Authorization': 'Bearer ' + llave(), 'Accept': 'application/vnd.github+json' };
  if (opts.body) h['Content-Type'] = 'application/json';
  return fetch(api() + '/repos/' + repo() + (path ? '/contents/' + path : ''), { method: opts.method || 'GET', headers: h, body: opts.body ? JSON.stringify(opts.body) : undefined, cache: 'no-store' })
    .then(function (r) {
      if (r.status === 404) return null;
      if (r.status === 401 || r.status === 403) throw { code: 'llave' };
      if (r.status === 409 || r.status === 422) throw { code: 'conflicto' };
      if (!r.ok) throw { code: 'http', status: r.status };
      return r.json();
    });
}
function leerJson(path) { return gh(path).then(function (j) { if (!j) return null; D.sha[path] = j.sha; return JSON.parse(b64dec(j.content)); }); }
function escribirJson(path, obj, msg) {
  var body = { message: msg, content: b64enc(JSON.stringify(obj, null, 1) + '\n') };
  if (D.sha[path]) body.sha = D.sha[path];
  return gh(path, { method: 'PUT', body: body }).then(function (r) { D.sha[path] = r && r.content ? r.content.sha : null; });
}

/* Guardar con mezcla: se lee lo último, se mezcla lo de este aparato y se sube. Si choca, se reintenta una vez. */
var ARCHIVOS = { reg: 'habitos/registro.json', reac: 'aprender/reacciones.json', hechas: 'hoy/hechas.json' };
function mezclar(tipo, remoto) {
  var loc = D[tipo], out = remoto || (tipo === 'reg' ? { v: 1, dias: {} } : { v: 1, items: {} });
  if (tipo === 'reg') {
    Object.keys(loc.dias || {}).forEach(function (f) { out.dias[f] = Object.assign({}, out.dias[f] || {}, loc.dias[f]); Object.keys(out.dias[f]).forEach(function (k) { if (out.dias[f][k] === null) delete out.dias[f][k]; }); });
  } else {
    Object.keys(loc.items || {}).forEach(function (k) { out.items[k] = loc.items[k]; });
  }
  return out;
}
function subir(tipo, msg, intento) {
  if (!llave()) return Promise.resolve();
  D.pend[tipo] = msg; guardar();
  return leerJson(ARCHIVOS[tipo]).then(function (rem) {
    if (!rem) delete D.sha[ARCHIVOS[tipo]];
    var m = mezclar(tipo, rem);
    return escribirJson(ARCHIVOS[tipo], m, msg).then(function () { D[tipo] = m; delete D.pend[tipo]; guardar(); pintarSync(); });
  }).catch(function (e) {
    if (e && e.code === 'conflicto' && !intento) return subir(tipo, msg, true);
    pintarSync('No se ha podido guardar en GitHub; se reintenta al abrir.');
  });
}
var sincronizando = false;
function sincronizar() {
  if (!llave() || sincronizando) return Promise.resolve();
  sincronizando = true; pintarSync('Actualizando…');
  var pend = Object.keys(D.pend);
  return Promise.all(pend.map(function (t) { return subir(t, D.pend[t]); }))
    .then(function () { return Promise.all([leerJson('panel.json'), leerJson('habitos/config.json'), leerJson(ARCHIVOS.reg), leerJson(ARCHIVOS.reac), leerJson(ARCHIVOS.hechas)]); })
    .then(function (r) {
      if (!r[0]) throw { code: 'repo' };
      D.panel = r[0]; D.cfg = r[1]; D.reg = r[2] || { v: 1, dias: {} }; D.reac = r[3] || { v: 1, items: {} }; D.hechas = r[4] || { v: 1, items: {} };
      D.sync = Date.now(); guardar(); pintar(); fondo();
    })
    .catch(function (e) { pintarSync(e && e.code === 'llave' ? 'La llave no vale o ha caducado: ve a Ajustes.' : e && e.code === 'repo' ? 'No encuentro panel.json en el repositorio.' : 'Sin conexión: enseño lo último guardado.'); })
    .then(function () { sincronizando = false; pintarSync(); });
}
function pintarSync(txt) {
  var el = $('sync'); if (!el) return;

    h += '</div></div>';
  });
  return h + '</div></div></section></div>';
}

function vistaAjustes() {
  var fotos = ((D.panel && D.panel.fondos) || []).map(function (f) { return f.n; }), pref = lsGet(K.foto) || 'Del día (al azar)';
  var h = cab('Este aparato', 'Ajustes') + '<div class="g"><section class="glass card s6"><span class="lbl">Conexión con tus datos</span><div class="m" style="font-size:14px;line-height:1.5">Tus datos viven en tu repositorio privado de GitHub. La llave se queda solo en este aparato y nunca se envía a otro sitio.</div>';
  h += '<label class="field">Repositorio<input id="f-repo" autocapitalize="off" autocorrect="off" spellcheck="false" value="' + esc(repo()) + '"></label><label class="field">Llave de GitHub<input id="f-llave" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="' + (llave() ? 'Llave guardada (déjalo vacío para mantenerla)' : 'github_pat_…') + '"></label><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn dark" data-act="conectar">Conectar</button>' + (llave() ? '<button class="btn" data-act="desconectar">Quitar la llave</button>' : '') + '</div><div class="m" id="f-msg"></div></section>';
  h += '<section class="glass card s6"><span class="lbl">Fondo</span><label class="field">Foto<select id="f-foto">' + ['Del día (al azar)'].concat(fotos).map(function (n) { return '<option' + (n === pref ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('') + '</select></label><div class="m">«Del día» cambia sola cada día y es la misma todo el día.</div><div class="m" style="margin-top:8px">Panel ' + VERSION + '</div></section></div>';
  return h;
}

/* ---------- acciones ---------- */
document.addEventListener('click', function (ev) {
  var b = ev.target.closest('[data-act]'); if (!b) return;
  var a = b.getAttribute('data-act'), id = b.getAttribute('data-id');
  if (a === 'acc') { UI.acc[id] = !UI.acc[id]; pintar(); }
  else if (a === 'vertodo') { UI.verTodo = !UI.verTodo; pintar(); }
  else if (a === 'acc-ok') {
    var gr = b.getAttribute('data-ids'), ids = gr ? gr.split(',') : Object.keys(UI.acc).filter(function (k) { return UI.acc[k]; }), ahora = new Date().toISOString();
    ids.forEach(function (k) { D.hechas.items[k] = { fecha: ahora }; delete UI.acc[k]; }); guardar(); pintar();
    toast(ids.length === 1 ? 'Hecha. Claude la quita de tus pendientes.' : ids.length + ' hechas. Claude las quita de tus pendientes.');
    subir('hechas', 'panel: tareas hechas');
  }
  else if (a === 'reac') {
    var p = D.panel.pildora, n = b.getAttribute('data-n');
    D.reac.items[p.id] = { nivel: n, fecha: hoyIso(), tema: p.tema, titulo: p.titulo, texto: p.texto }; guardar(); pintar();
    toast(n === 'mucho' ? 'Apuntada: va a tu correo del domingo.' : n === 'si' ? 'Apuntado: te interesa.' : 'Apuntado: no te interesa.');
    subir('reac', 'panel: interés en la píldora');
  }
  else if (a === 'repasado') { var r = D.reac.items[id]; if (r) { r.repasado = hoyIso(); guardar(); pintar(); subir('reac', 'panel: píldora repasada'); } }
  else if (a === 'hab') { UI.sel[id] = !UI.sel[id]; if (id === 'lectura' && !UI.sel[id]) UI.tramo = null; pintar(); }
  else if (a === 'tramo') { UI.tramo = id; pintar(); }
  else if (a === 'hab-ok') {
    var hoy = hoyIso(), ms = Object.keys(UI.sel).filter(function (k) { return UI.sel[k]; });
    if (!ms.length || (UI.sel.lectura && !UI.tramo)) return;
    D.reg.dias[hoy] = D.reg.dias[hoy] || {};
    ms.forEach(function (k) { D.reg.dias[hoy][k] = k === 'lectura' ? UI.tramo : true; });
    var nombres = ms.map(function (k) { var x = habitos().filter(function (h) { return h.id === k; })[0]; return x ? x.nombre.toLowerCase() : k; });
    UI.sel = {}; UI.tramo = null; guardar(); pintar();
    toast('Apuntado: ' + nombres.join(', ') + '.');
    subir('reg', 'panel: hábitos del ' + hoy);
  }
  else if (a === 'conectar') {
    var tk = $('f-llave').value.trim(), rp = $('f-repo').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\.git$/, '').replace(/\/+$/, '');
    if (!tk && !llave()) { $('f-msg').textContent = 'Pega la llave de GitHub.'; return; }
    if (!/^[\w.-]+\/[\w.-]+$/.test(rp)) { $('f-msg').textContent = 'El repositorio va como usuario/nombre.'; return; }
    var antes = llave(); if (tk) lsSet(K.llave, tk); lsSet(K.repo, rp);
    $('f-msg').textContent = 'Comprobando…';
    leerJson('panel.json').then(function (j) {
      if (!j) { $('f-msg').textContent = 'La llave vale, pero no encuentro panel.json en ' + rp + '.'; return; }
      $('f-msg').textContent = 'Conectado.'; toast('Conectado. Cargando tus datos…'); location.hash = '#hoy'; sincronizar();
    }).catch(function (e) { if (tk) lsSet(K.llave, antes || null); $('f-msg').textContent = e && e.code === 'llave' ? 'La llave no vale o no tiene acceso a ese repositorio.' : 'No he podido conectar. ¿Hay internet?'; });
  }
  else if (a === 'desconectar') { lsSet(K.llave, null); toast('Llave quitada de este aparato.'); pintar(); }
});
document.addEventListener('change', function (ev) { if (ev.target.id === 'f-foto') { lsSet(K.foto, ev.target.value); lsSet(K.bgf, null); fondo(); toast('Fondo cambiado.'); } });
window.addEventListener('hashchange', function () { pintar(); window.scrollTo(0, 0); });
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') sincronizar(); });
pintar(); fondo(); sincronizar();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
